<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>音乐制作工具 · AI 音乐创作</title>
    <meta name="description" content="降低创作门槛，让每个人都能写一首自己的歌" />
    <!-- PWA 配置（手机添加到桌面图标 / 全屏模式） -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="音乐创作" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      CloudBase 静态站独立部署时注入 API 地址：
        部署前把下面 __API_BASE__ 改成云函数的 HTTP 访问地址
        例：window.__API_BASE__ = 'https://你的环境ID.service.tcloudbase.com/api'
      如果静态站和 API 同源（Vercel/Railway/源码运行），保持 null 即可（默认走同域 /api）
    -->
    <script>window.__API_BASE__ = null;</script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA 注册 Service Worker（手机安装后启动更快） -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
